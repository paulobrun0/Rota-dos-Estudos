<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0D13" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rota dos Estudos" />
    <title>Plano de Estudos</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; }
      body { background: var(--bg); }
      #root { min-height: 100vh; }

      :root {
        --bg: #0B0D13;
        --surface: #151822;
        --surface2: #1D2130;
        --border: #2B3042;
        --border-soft: #232738;
        --text: #F3F4F8;
        --text-muted: #99A2BB;
        --text-faint: #5E6680;
        --amber: #F2A93B;
        --amber-soft: #3D2C14;
        --teal: #46D9C6;
        --teal-soft: #123330;
        --red: #F16660;
        --red-soft: #3D1E1E;
        --heat-1: #4D3618;
        --heat-2: #8C6222;
      }
      :root[data-theme="light"] {
        --bg: #F7F7FB;
        --surface: #FFFFFF;
        --surface2: #EFF1F7;
        --border: #DEE2EC;
        --border-soft: #E9EBF2;
        --text: #191C24;
        --text-muted: #565F74;
        --text-faint: #8890A6;
        --amber: #C17A16;
        --amber-soft: #FCEBD2;
        --teal: #17897C;
        --teal-soft: #DAF2EE;
        --red: #C13A38;
        --red-soft: #FBE2E1;
        --heat-1: #F4DEB2;
        --heat-2: #ECC178;
      }
    </style>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("ciclo-estudos-theme");
          var theme = saved === "light" || saved === "dark"
            ? saved
            : (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
          document.documentElement.dataset.theme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
