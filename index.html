<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F8F5ED" />
    <link rel="icon" type="image/svg+xml" href="./brand.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Questão de Ritmo" />
    <title>Questão de Ritmo — cada questão, um passo à frente</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; }
      body { background: var(--bg); }
      #root { min-height: 100vh; }

      :root {
        color-scheme: light;
        --bg: #F8F5ED; --surface: #FFFDF8; --surface2: #F1EBDF;
        --border: #DDD4C5; --border-soft: #EBE3D7;
        --text: #222932; --text-muted: #665F55; --text-faint: #756D62;
        --accent: #A3432E; --accent-soft: #F6E5DA; --on-accent: #FFFFFF;
        --success: #167451; --success-soft: #E3F4ED;
        --red: #BF3650; --red-soft: #FCE9EE;
        --heat-1: #B7E7DD; --heat-2: #6DC9B9;
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #211E1A; --surface: #2A2621; --surface2: #352F28;
        --border: #554A3E; --border-soft: #433A31;
        --text: #F7F0E5; --text-muted: #D0C1AC; --text-faint: #B9A78F;
        --accent: #F0AB8B; --accent-soft: #493024; --on-accent: #31251C;
        --success: #7BDBAF; --success-soft: #193C34;
        --red: #FFA2B5; --red-soft: #442937;
        --heat-1: #225657; --heat-2: #32988F;
      }
      body { font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: var(--text); }
      button, input, textarea, select { font: inherit; }
      button { cursor: pointer; transition: background .15s, border-color .15s, box-shadow .15s; }
      button:disabled { cursor: not-allowed; opacity: .65; }
      button:hover:not(:disabled) { filter: brightness(.97); }
      button:focus-visible, a:focus-visible, summary:focus-visible,
      input:focus-visible, textarea:focus-visible, select:focus-visible {
        outline: 3px solid var(--accent); outline-offset: 3px;
      }
      input, textarea { line-height: 1.5; }
      ::placeholder { color: var(--text-faint); }
      h1, h2, h3, p { overflow-wrap: anywhere; }
      .sg { font-family: Georgia, "Times New Roman", serif; letter-spacing: -.035em; }
      .mono { font-family: ui-monospace, monospace; }
      .app-nav { background: #A3432E; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
      .nav-toggle-row { display: flex; justify-content: flex-end; margin-bottom: 8px; }
      @media (min-width: 861px) {
        .app-nav.collapsed { width: 76px !important; padding: 18px 8px !important; }
        .app-nav.collapsed .nav-label, .app-nav.collapsed .nav-context-label, .app-nav.collapsed .nav-user-label, .app-nav.collapsed .nav-brand > div > div { display: none; }
        .app-nav.collapsed .nav-item { justify-content: center; gap: 0 !important; }
        .app-nav.collapsed .nav-concurso { justify-content: center; }
        .app-nav.collapsed .nav-concurso > svg { display: none; }
        .app-nav.collapsed .nav-brand > div { justify-content: center; }
        .app-nav.collapsed .nav-toggle-row { justify-content: center; }
      }
      @media (max-width: 860px) { .nav-toggle-row { display: none; } }
      .nav-item:not([aria-current]):hover { background: var(--surface2) !important; }
      .stat-tile { box-shadow: 0 3px 14px #18243d05; }
      .stat-tile svg { background: var(--accent-soft); padding: 7px; box-sizing: content-box; border-radius: 10px; }
      .app-heading { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 26px; }
      .app-heading p { margin: 5px 0 0; color: var(--text-muted); font-size: 13px; }
      .app-heading h1 { margin: 0; font-size: 26px; }
      .auth-shell { min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: 64px; padding: 64px max(5vw, 24px); background: radial-gradient(ellipse at 10% 20%, var(--accent-soft), transparent 65%), var(--bg); }
      .auth-story { max-width: 520px; }
      .auth-story h1 { font-size: clamp(36px, 4.5vw, 62px); line-height: 1.08; margin: 42px 0 24px; letter-spacing: -.055em; }
      .auth-story p { color: var(--text-muted); line-height: 1.8; font-size: 16px; max-width: 410px; }
      .auth-form { width: 100%; max-width: 420px; justify-self: center; box-shadow: 0 18px 60px #18243d0a; }
      .auth-features { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }
      .auth-features span { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 12px; background: var(--surface); color: var(--text-muted); font-size: 13px; border: 1px solid var(--border); }
      @media (max-width: 860px) {
        .auth-shell { grid-template-columns: 1fr; gap: 28px; padding: 32px 20px; }
        .auth-story { max-width: 420px; justify-self: center; }
        .auth-story h1 { font-size: 34px; margin: 24px 0 12px; }
        .auth-story p, .auth-features { display: none; }
        .app-heading { margin-bottom: 20px; }
        .app-heading h1 { font-size: 22px; }
        .app-heading .heading-label { display: none !important; }
      }

      .materia-heading { flex-wrap: wrap; gap: 10px; }
      .materia-heading > div { min-width: 0; max-width: 100%; }
      .today-priorities { padding: 14px; margin-bottom: 18px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
      details > summary { cursor: pointer; overflow-wrap: anywhere; }
      .practice-evidence { color: var(--text-muted); }
      .topic-table th { overflow-wrap: anywhere; }
      .topic-table-wrap { margin: 14px 0; border: 1px solid var(--border); border-radius: 10px; overflow: visible; }
      .topic-table { table-layout: fixed; min-width: 0; width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
      .topic-table th { background: var(--surface2); color: var(--text-muted); font-size: 11px; letter-spacing: .025em; padding: 12px; font-weight: 600; }
      .topic-table td { padding: 13px 12px; border-top: 1px solid var(--border-soft); vertical-align: middle; overflow-wrap: anywhere; }
      .topic-table td:first-child { width: 40%; line-height: 1.5; }
      .topic-table tbody tr:hover { background: var(--bg); }
      .edital-topics-table td:first-child { width: 30%; }
      .edital-topics-table th:nth-child(1) { width: 30%; }
      .edital-topics-table th:nth-child(2) { width: 17%; }
      .edital-topics-table th:nth-child(3) { width: 13%; }
      .edital-topics-table th:nth-child(4) { width: 24%; }
      .edital-topics-table th:nth-child(5) { width: 16%; }
      .topic-table .topic-actions > *, .daily-actions > * { max-width: 100%; min-width: 0; overflow-wrap: anywhere; white-space: normal; }
      .topic-table input { min-width: 0; max-width: 100%; }
      .topic-actions { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
      .topic-actions button { min-width: 28px; min-height: 28px; }
      .topic-status { display: inline-block; border-radius: 6px; font-size: 11px; padding: 4px 8px; }
      .topic-detail { background: var(--surface2); }
      .daily-topic-head, .daily-topic-row { display: grid; grid-template-columns: 24px minmax(0, 1.5fr) minmax(0, .6fr) minmax(0, .5fr) minmax(0, 1fr); gap: 12px; align-items: center; }
      .daily-topic-head { font-size: 11px; color: var(--text-muted); padding: 10px 12px; background: var(--surface2); }
      .daily-topic-table { border: 1px solid var(--border); border-radius: 10px; }
      .daily-topic-row > * { min-width: 0; max-width: 100%; overflow-wrap: anywhere; }
      .daily-topic-item { padding: 13px 12px; border-top: 1px solid var(--border-soft); }
      .daily-topic-row > :nth-child(3) { justify-self: start; }

      @media (max-width: 640px) {
        .topic-table { font-size: 10px; }
        .topic-table th { padding: 8px 4px; font-size: 9px; overflow-wrap: anywhere; }
        .topic-table td { padding: 9px 4px; }
        .topic-table .topic-actions { gap: 4px; }
        .topic-table .topic-actions button, .daily-actions button { padding: 3px !important; font-size: 10px !important; }
        .topic-status { font-size: 9px; padding: 3px; }
        .daily-topic-head, .daily-topic-row { grid-template-columns: 22px minmax(0, 1.1fr) minmax(0, .6fr) minmax(0, .5fr) minmax(0, 1fr); gap: 5px; }
        .daily-topic-head, .daily-topic-item { padding: 9px 6px; }
        .daily-topic-head { font-size: 9px; overflow-wrap: anywhere; }
        .daily-topic-row > :nth-child(2) > div { font-size: 11px !important; }
        .daily-topic-row > :nth-child(3) { padding: 3px !important; font-size: 9px !important; }
        .daily-actions { gap: 4px; }
      }

      .study-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 20px; min-width: 0; }
      .study-panel-heading { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 14px; }
      .study-panel-heading h2 { margin: 0; font-size: 16px; letter-spacing: -.02em; }
      .study-panel-heading button { margin-top: 0 !important; }
      .study-metrics { display: grid; grid-template-columns: repeat(auto-fit,minmax(160px,1fr)); gap: 14px; margin-bottom: 24px; }
      .study-metric { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
      .study-metric > span, .study-metric small { color: var(--text-muted); font-size: 12px; }
      .study-metric strong { font-size: 27px; color: var(--text); letter-spacing: -.04em; }
      .dashboard-columns { display: grid; grid-template-columns: minmax(0,1fr) 310px; gap: 20px; align-items: start; }
      .dashboard-columns > div, .dashboard-columns aside { min-width: 0; }
      .dashboard-meta, .muted { font-size: 12px; line-height: 1.65; color: var(--text-muted); }
      .insight-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border-soft); font-size: 13px; }
      .insight-row > div { min-width: 0; overflow-wrap: anywhere; }
      .insight-row small { display: block; font-size: 11px; color: var(--text-muted); margin-top: 4px; }
      .cycle-row { display: flex; align-items: center; gap: 10px; padding: 13px 0; border-bottom: 1px solid var(--border-soft); font-size: 12px; }
      .cycle-row strong { flex: 1; min-width: 0; }
      .cycle-row > span:last-child { font-size: 11px; color: var(--text-muted); white-space: nowrap; }
      .cycle-number { background: var(--accent-soft); color: var(--accent); border-radius: 8px; padding: 6px; font-weight: 700; }
      .filter-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .filter-bar input { min-width: 150px; flex: 2; }
      .filter-bar select { min-width: 140px; flex: 1; }
      .form-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(180px,1fr)); gap: 12px; }
      .form-grid label, .study-form > label { display: grid; gap: 6px; font-size: 12px; color: var(--text-muted); min-width: 0; }
      .form-grid input, .form-grid select { width: 100%; min-width: 0; }
      .study-form { border: 1px solid var(--border); background: var(--bg); border-radius: 10px; padding: 16px; margin: 14px 0; display: grid; gap: 12px; min-width: 0; }
      .study-form h3 { margin: 0; }
      .study-form summary { cursor: pointer; font-size: 13px; }
      .score-chart { display: flex; gap: 16px; overflow-x: auto; padding: 20px 0; }
      .score-column { flex: 0 0 90px; min-width: 65px; text-align: center; display: grid; gap: 7px; font-size: 13px; }
      .score-column small { font-size: 10px; color: var(--text-muted); overflow-wrap: anywhere; }
      .score-bar-track { height: 120px; display: flex; align-items: end; background: var(--surface2); border-radius: 6px; overflow: hidden; }
      .score-bar-track > div { width: 100%; }
      .concurso-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(min(100%,330px),1fr)); gap: 16px; }
      .concurso-stats { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 6px; margin: 16px 0; }
      .concurso-stats .study-metric { padding: 10px; background: var(--surface2); border: 0; }
      .concurso-stats .study-metric strong { font-size: 18px; }
      .concurso-stats .study-metric > span { font-size: 10px; }
      @media (max-width: 1100px) { .dashboard-columns { grid-template-columns: 1fr; } }
      @media (max-width: 640px) { .study-panel { padding: 14px; } .study-metrics { grid-template-columns: 1fr 1fr; gap: 10px; } .study-metric { padding: 14px; } .study-metric strong { font-size: 23px; } .form-grid { grid-template-columns: 1fr; } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

      .app-nav .nav-item, .app-nav .nav-item span, .app-nav .nav-item svg, .app-nav .nav-user-label, .app-nav .nav-brand .sg, .app-nav .nav-brand .sg + div, .app-nav .nav-toggle { color: #FFF8EE !important; }
      .app-nav .nav-item[aria-current="page"] { background: #FFFFFF20 !important; box-shadow: inset 3px 0 #FFF8EE; }
      .app-nav .nav-item:not([aria-current]):hover { background: #FFFFFF12 !important; }
      .app-nav .nav-concurso { background: #00000010 !important; border-color: #FFFFFF30 !important; color: #FFF8EE !important; }
      .app-nav .nav-context-label > div { color: #FFF8EE !important; }
      .app-nav > div:last-child button { color: #FFF8EE !important; }
      .app-heading { padding-bottom: 20px; border-bottom: 1px solid var(--border); }
      .study-panel { border-radius: 8px !important; }
      .study-panel-heading h2, .dashboard-welcome h2, .session-spotlight h2 { font-family: Georgia, "Times New Roman", serif; }
      .dashboard-welcome { display:flex; align-items:center; justify-content:space-between; gap:18px; margin:12px 0 24px; }
      .dashboard-welcome h2 { font-size: clamp(26px,3vw,38px); margin:12px 0; }
      .eyebrow { font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--accent); font-weight:700; }
      .date-stamp { flex-shrink:0; display:grid; justify-items:center; padding:8px 12px; border:3px double var(--accent); border-radius:6px; color:var(--accent); transform:rotate(3deg); }
      .date-stamp strong { font:700 28px Georgia,serif; }
      .date-stamp span { font-size:10px; text-transform:uppercase; letter-spacing:1px; }
      .view-tabs { display:flex; flex-wrap:wrap; gap:8px; margin:18px 0; padding-bottom:12px; border-bottom:1px solid var(--border); }
      .view-tabs [aria-selected="true"], .view-tabs [aria-pressed="true"] { border-color:var(--accent) !important; background:var(--accent-soft) !important; }
      .session-spotlight { border-left:3px solid var(--accent); padding-left:18px; }
      .session-spotlight h2 { font-size:27px; margin:14px 0 8px; }
      .session-spotlight h3 { font-size:16px; font-weight:500; margin:8px 0; }
      .session-clock { font-variant-numeric:tabular-nums; font-size:34px; margin:18px 0; color:var(--accent); }
      .learning-calendar { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr)); gap:10px; }
      .calendar-day { border:1px solid var(--border); border-radius:7px; padding:12px; min-width:0; }
      .calendar-day.today { border-color:var(--accent); }
      .calendar-day small { display:block; color:var(--text-muted); margin-top:5px; font-size:11px; }
      .activity-bars > div { display:grid; grid-template-columns:55px minmax(0,1fr) 65px; gap:8px; align-items:center; margin:10px 0; font-size:12px; }
      .activity-track { height:12px; background:var(--surface2); border-radius:3px; overflow:hidden; }
      .activity-track i { height:100%; background:var(--accent); display:block; }
      .study-mark { border-left:3px solid var(--accent); padding:14px; margin:10px 0; white-space:pre-wrap; overflow-wrap:anywhere; color:#222932; }
      .study-mark.yellow { background:#FFF0BB; } .study-mark.green { background:#DDF0CD; } .study-mark.pink { background:#F8D7DB; }
      .review-note { padding:16px; background:var(--surface2); white-space:pre-wrap; }
      .help-fab { position:fixed; right:20px; bottom:20px; z-index:40; border:0; border-radius:999px; padding:14px 18px; color:var(--on-accent); background:var(--accent); box-shadow:0 5px 24px #0002; }
      .help-drawer { position:fixed; right:20px; bottom:78px; width:min(370px,calc(100vw - 40px)); max-height:70vh; overflow-y:auto; border:1px solid var(--border); border-radius:12px; background:var(--surface); padding:20px; box-shadow:0 10px 40px #0002; z-index:41; }
      .help-drawer details { padding:12px 0; border-bottom:1px solid var(--border); }
      .topic-table select, .topic-table button { max-width:100%; min-width:0; white-space:normal; overflow-wrap:anywhere; }
    </style>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("ciclo-estudos-theme");
          var theme = saved === "light" || saved === "dark"
            ? saved
            : "light";
          document.documentElement.dataset.theme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
