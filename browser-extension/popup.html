<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Marcações de estudo</title><link rel="stylesheet" href="popup.css"></head><body><h1>Ritmo · Estudo</h1><p>Selecione um trecho na página e capture aqui. Os registros ficam neste navegador.</p><button id="capture">Capturar seleção</button><label>Trecho<textarea id="text" maxlength="20000"></textarea></label><label>Nota<textarea id="note"></textarea></label><label>Cor<select id="color"><option value="yellow">Amarelo</option><option value="green">Verde</option><option value="pink">Rosa</option></select></label><button id="save">Guardar marcação</button><p id="status" role="status"></p><h2>Minhas marcações</h2><input id="search" placeholder="Buscar trecho ou nota"><div id="entries"></div><button id="export">Exportar para o Ritmo</button><p>O arquivo pode ser importado na tela Ferramentas. Não sincroniza contas nem respostas do TEC ou Qconcursos. PDFs e páginas protegidas podem impedir captura.</p><script src="popup.js"></script></body></html>
